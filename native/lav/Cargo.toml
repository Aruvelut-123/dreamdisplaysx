[package]
name = "dreamdisplayx-lav"
version = "1.3.0"
edition = "2024"
authors = ["arnodoelinger"]
description = "In-process libav decode backend for Dream DisplaysX."
license = "LGPL-3.0"

[lib]
name = "dreamdisplayx_lav"
crate-type = ["cdylib", "lib"]

[dependencies]
anyhow = "1.0.103"
dreamdisplayx-logging = { path = "../logging" }
ffmpeg-next = { version = "8.1.0", default-features = false, features = ["codec", "format", "software-scaling", "software-resampling"] }
log = "0.4.33"
rayon = "1.12.0"
