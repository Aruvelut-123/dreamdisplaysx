name: Build

# Reusable build pipeline: assembles the loader jars using JavaCPP for video
# decode (in-process FFmpegFrameGrabber) and the Gradle multi-version
# (Stonecutter) build system. Called by ci.yml and release.yml.
on:
  workflow_call:
    inputs:
      pull_request:
        description: When true, trim to a single Stonecutter version (PR code-correctness run).
        type: boolean
        default: false
      build_type:
        description: >
          Sets the publish channel entirely from the workflow_dispatch input:
          dev (artifacts only, never published), preview (alpha pre-release),
          or release (stable). Leave empty for a plain build that never
          publishes (used by the CI workflow).
        type: string
        default: ''
    outputs:
      version:
        value: ${{ jobs.metadata.outputs.version }}
      pretty_version:
        value: ${{ jobs.metadata.outputs.pretty_version }}
      is_dev:
        value: ${{ jobs.metadata.outputs.is_dev }}
      is_preview:
        value: ${{ jobs.metadata.outputs.is_preview }}
      is_release:
        value: ${{ jobs.metadata.outputs.is_release }}
      is_marketplace_publishable:
        value: ${{ jobs.metadata.outputs.is_marketplace_publishable }}
      marketplace_publish_tasks:
        value: ${{ jobs.metadata.outputs.marketplace_publish_tasks }}

permissions:
  contents: read

jobs:
  metadata:
    name: Metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      pretty_version: ${{ steps.get_version.outputs.pretty_version }}
      is_dev: ${{ steps.get_version.outputs.is_dev }}
      is_preview: ${{ steps.get_version.outputs.is_preview }}
      is_release: ${{ steps.get_version.outputs.is_release }}
      is_marketplace_publishable: ${{ steps.get_version.outputs.is_marketplace_publishable }}
      stonecutter_versions: ${{ steps.stonecutter_versions.outputs.versions_json }}
      build_stonecutter_versions: ${{ steps.stonecutter_versions.outputs.build_versions_json }}
      primary_stonecutter_version: ${{ steps.stonecutter_versions.outputs.primary_version }}
      paper_build_version: ${{ steps.stonecutter_versions.outputs.paper_build_version }}
      marketplace_publish_tasks: ${{ steps.stonecutter_versions.outputs.marketplace_tasks_json }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.3
        with:
          fetch-depth: 1

      - name: Detect Stonecutter versions
        id: stonecutter_versions
        env:
          IS_PR: ${{ inputs.pull_request }}
        run: |
          python3 - <<'EOF'
          import json, os

          versions = sorted(
              p for p in os.listdir("versions")
              if os.path.isfile(os.path.join("versions", p, "gradle.properties"))
          )

          if not versions:
              raise SystemExit("No Stonecutter versions found")

          def read_props(path):
              props = {}
              with open(path) as f:
                  for line in f:
                      line = line.strip()
                      if not line or line.startswith("#") or "=" not in line:
                          continue
                      key, value = line.split("=", 1)
                      props[key.strip()] = value.strip()
              return props

          def version_key(v):
              return tuple(int(x) if x.isdigit() else 0 for x in v.split("."))

          PAPER_MIN = (1, 21, 11)
          paper_build_candidates = sorted(
              v for v in versions
              if read_props(os.path.join("versions", v, "gradle.properties")).get("java.version") == "21"
              and version_key(v) >= PAPER_MIN
          )
          if not paper_build_candidates:
              raise SystemExit("No Java 21 Minecraft version >= 1.21.11 available to build the Paper jar")
          paper_build_version = paper_build_candidates[0]

          tasks = (
              [{"kind": "fabric", "mc": version} for version in versions] +
              [{"kind": "neoforge", "mc": version} for version in versions] +
              [{"kind": "paper", "mc": paper_build_version}] +
              [{"kind": "velocity", "mc": paper_build_version}] +
              [{"kind": "bungeecord", "mc": paper_build_version}]
          )

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"versions_json={json.dumps(versions)}\n")
              f.write(f"build_versions_json={json.dumps(versions)}\n")
              f.write(f"primary_version={versions[0]}\n")
              f.write(f"paper_build_version={paper_build_version}\n")
              f.write(f"marketplace_tasks_json={json.dumps(tasks)}\n")
          EOF

      - name: Get version
        id: get_version
        env:
          BUILD_TYPE: ${{ inputs.build_type }}
        run: |
          set -euo pipefail
          VERSION=$(grep '^version' gradle.properties | cut -d'=' -f2 | tr -d ' ')
          # Numeric trunk (strip any -dev / -preview.N suffix), e.g. 1.9.3.1-dev -> 1.9.3.1.
          TRUNK="${VERSION%%-*}"
          echo "source_version=$VERSION" >> $GITHUB_OUTPUT
          echo "version_trunk=$TRUNK" >> $GITHUB_OUTPUT

          # The publish channel is set entirely by the workflow_dispatch `build_type` input.
          # An empty BUILD_TYPE (e.g. the CI workflow) means "build only, never publish".
          case "$BUILD_TYPE" in
            dev)
              channel="dev"
              PUBLISH="$VERSION"
              pretty="$VERSION Developer"
              ;;
            preview)
              channel="preview"
              # Compute the next preview ordinal from existing v$TRUNK-preview.N tags.
              TRUNK_ESC="${TRUNK//./\.}"
              MAX_N=$(
                git ls-remote --tags origin "refs/tags/v${TRUNK}-preview.*" 2>/dev/null \
                  | grep -oE "v${TRUNK_ESC}-preview\.[0-9]+$" \
                  | grep -oE "[0-9]+$" \
                  | sort -n \
                  | tail -1
              )
              # No existing preview tag for this version -> preview.0, else latest + 1.
              if [[ -z "$MAX_N" ]]; then
                NEXT=0
              else
                NEXT=$(( MAX_N + 1 ))
              fi
              PUBLISH="${TRUNK}-preview.${NEXT}"
              pretty="${TRUNK} Preview ${NEXT}"
              ;;
            release)
              channel="release"
              PUBLISH="$TRUNK"
              pretty="${TRUNK} Release"
              ;;
            *)
              channel=""
              PUBLISH="$VERSION"
              pretty="$VERSION"
              ;;
          esac

          echo "version=$PUBLISH" >> $GITHUB_OUTPUT

          # Persist the computed publish version so the loader builds use it (jar naming).
          if [[ "$BUILD_TYPE" == "release" || "$BUILD_TYPE" == "preview" || "$BUILD_TYPE" == "dev" ]]; then
            sed -i "s/^version=.*/version=$PUBLISH/" gradle.properties
            echo "Persisted version=$PUBLISH to gradle.properties."
          fi

          case "$channel" in
            dev)
              echo "is_dev=true" >> $GITHUB_OUTPUT
              echo "is_preview=false" >> $GITHUB_OUTPUT
              echo "is_release=false" >> $GITHUB_OUTPUT
              echo "is_marketplace_publishable=false" >> $GITHUB_OUTPUT
              ;;
            preview)
              echo "is_dev=false" >> $GITHUB_OUTPUT
              echo "is_preview=true" >> $GITHUB_OUTPUT
              echo "is_release=false" >> $GITHUB_OUTPUT
              echo "is_marketplace_publishable=true" >> $GITHUB_OUTPUT
              ;;
            release)
              echo "is_dev=false" >> $GITHUB_OUTPUT
              echo "is_preview=false" >> $GITHUB_OUTPUT
              echo "is_release=true" >> $GITHUB_OUTPUT
              echo "is_marketplace_publishable=true" >> $GITHUB_OUTPUT
              ;;
            *)
              echo "is_dev=false" >> $GITHUB_OUTPUT
              echo "is_preview=false" >> $GITHUB_OUTPUT
              echo "is_release=false" >> $GITHUB_OUTPUT
              echo "is_marketplace_publishable=false" >> $GITHUB_OUTPUT
              ;;
          esac
          echo "pretty_version=$pretty" >> $GITHUB_OUTPUT

  # ========================================================================
  # native natives: downloaded from a GitHub Release produced by the
  # standalone "Build Natives" workflow (natives.yml), which compiles the
  # relocated sqlite JNI symbols and collects the official LibVLC runtime for
  # Fabric/NeoForge mod isolation. Building the 6-platform C bundles on every
  # CI run would be wasteful since the sources never change between builds.
  # Run that workflow (workflow_dispatch) whenever the sqlite version,
  # VLC version or compiler flags change.
  # ========================================================================
  download-natives:
    name: Download natives
    runs-on: ubuntu-latest
    needs: metadata
    timeout-minutes: 5
    outputs:
      natives_release: ${{ steps.check_release.outputs.natives_release }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.3
        with:
          fetch-depth: 1

      - name: Resolve natives release
        id: check_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # First try the tag from the marker file (if set up)
          if [[ -f .github/natives-tag.txt ]]; then
            TAG="$(cat .github/natives-tag.txt | tr -d '[:space:]')"
            if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
              echo "Found prebuilt natives release $TAG (from tag file)"
              echo "natives_release=$TAG" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Tag file points to $TAG which does not exist; falling back to latest release."
          fi

          # Fallback: find the most recent natives-* release
          LATEST="$(
            gh release list --repo "${{ github.repository }}" --limit 50 \
              --json tagName --jq '.[].tagName' \
              | grep -E '^natives-' \
              | sort -t- -k3 -n -r \
              | head -1
          )"
          if [[ -n "$LATEST" ]]; then
            echo "Found latest natives release $LATEST"
            echo "natives_release=$LATEST" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Compatibility fallback: legacy sqlite-natives-* release (from before the
          # unified "Build Natives" workflow). Lets main-branch builds keep working
          # until the first natives release is published, then natives-* wins.
          LEGACY="$(
            gh release list --repo "${{ github.repository }}" --limit 50 \
              --json tagName --jq '.[].tagName' \
              | grep -E '^sqlite-natives-' \
              | sort -t- -k3 -n -r \
              | head -1
          )"
          if [[ -n "$LEGACY" ]]; then
            echo "No natives-* release yet; using legacy sqlite release $LEGACY (libvlc deferred)."
            echo "natives_release=$LEGACY" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "ERROR: No natives release found."
          echo ""
          echo "Run the 'Build Natives' workflow (.github/workflows/natives.yml)"
          echo "manually (Actions -> Build Natives -> Run workflow) to compile and"
          echo "publish the 6-platform sqlite + libvlc native libraries, then re-run this build."
          exit 1

  # ========================================================================
  # Main build job
  # ========================================================================
  build:
    name: Build ${{ matrix.mc }}
    runs-on: ubuntu-latest
    needs:
      - metadata
      - download-natives
    timeout-minutes: 15
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        mc: ${{ fromJSON(needs.metadata.outputs.build_stonecutter_versions) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.3
        with:
          fetch-depth: 1

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6.1.0

      - name: Setup JDK 25
        uses: actions/setup-java@v5.2.0
        with:
          java-version: 25
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.1.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Select Stonecutter version
        run: echo "${{ matrix.mc }}" > versions/active.txt

      # The metadata job computed the publish version from the build_type input and wrote it back to
      # its own gradle.properties, but this build job re-checks out the repo, which resets that file.
      # Write the computed version here too so the loader jars are named with the publish version
      # (e.g. release -> 1.9.3.2, not the checked-in 1.9.3.2-dev).
      - name: Persist publish version for jar naming
        if: inputs.build_type == 'release' || inputs.build_type == 'preview' || inputs.build_type == 'dev'
        run: |
          VERSION="${{ needs.metadata.outputs.version }}"
          sed -i "s/^version=.*/version=$VERSION/" gradle.properties
          grep '^version' gradle.properties

      # Inject the commit hash into the client lang files before building. The
      # F3 debug overlay reads dreamdisplayx.debug.commit from the lang table,
      # so the placeholder (written as "unknown") becomes the real short hash
      # in the packed resources. Gradle's processResources expand cannot be
      # relied on (it silently skips resources outside the module's own source
      # set), so the CI job rewrites the files on disk before the build runs.
      # The Python helper rewrites the JSON properly (language files may contain
      # non-ASCII text, so sed/power-shell byte surgery corrupts them).
      - name: Inject commit hash into lang files
        run: |
          COMMIT="${GITHUB_SHA:0:8}"
          echo "Injecting commit $COMMIT into client lang files"
          python scripts/inject_commit_hash.py "$COMMIT"
          grep 'dreamdisplayx.debug.commit' platform/resources/src/main/resources/assets/dreamdisplayx/lang/client/en_us.json

      - name: Download native archives (sqlite + libvlc)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ needs.download-natives.outputs.natives_release }}"
          mkdir -p native/build/ci-bundle/dreamdisplayx-natives
          gh release download "$TAG" --repo "${{ github.repository }}" \
            --dir native/build/ci-bundle --pattern '*.tar.gz'
          # sqlite — handles both legacy native-*.tar.gz and unified sqlite-*.tar.gz
          for f in native/build/ci-bundle/native-*.tar.gz native/build/ci-bundle/sqlite-*.tar.gz; do
            [[ -f "$f" ]] && tar xzf "$f" -C native/build/ci-bundle/dreamdisplayx-natives
          done
          # libvlc — only present in unified release
          mkdir -p native/build/ci-bundle/libvlc
          for f in native/build/ci-bundle/libvlc-*.tar.gz; do
            [[ -f "$f" ]] || continue
            PLATFORM="$(basename "$f" | sed 's/libvlc-\(.*\)\.tar\.gz/\1/')"
            mkdir -p "native/build/ci-bundle/libvlc/$PLATFORM"
            tar xzf "$f" -C "native/build/ci-bundle/libvlc/$PLATFORM"
          done
          echo "=== sqlite natives ==="
          find native/build/ci-bundle/dreamdisplayx-natives -maxdepth 3 -type f -print | sort
          echo "=== libvlc natives ==="
          find native/build/ci-bundle/libvlc -maxdepth 4 -type f -print | sort | head -40

      - name: Build loaders with Gradle
        run: |
          ./gradlew \
            :platform:client:fabric:publishJar \
            :platform:client:neoforge:shadowJar \
            --no-daemon \
            --parallel
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Xmx4G

      - name: Build Paper with Gradle
        if: matrix.mc == needs.metadata.outputs.paper_build_version
        run: |
          ./gradlew \
            :platform:server:shadowJar \
            --no-daemon \
            --parallel
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Xmx4G

      - name: Build proxy plugins with Gradle
        if: matrix.mc == needs.metadata.outputs.paper_build_version
        run: |
          ./gradlew \
            :platform:proxy:velocity:shadowJar \
            :platform:proxy:bungeecord:shadowJar \
            --no-daemon \
            --parallel
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Xmx4G

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          # The Paper jar is cross-version and the proxy plugins are loader-independent; they are
          # built only in the paper_build_version job and uploaded as their own artifact below.
          cp build/libs/dreamdisplayx-fabric-*.jar build/libs/dreamdisplayx-neoforge-*.jar artifacts/

      # Paper is one cross-version jar (1.21.1 through 26.x, dispatched at runtime) and the proxy
      # plugins are loader-independent, so they are built once in the paper_build_version job. Ship
      # them as their own artifact instead of burying them in the versioned build-jars archive.
      - name: Upload cross-version platform jars
        if: matrix.mc == needs.metadata.outputs.paper_build_version
        uses: actions/upload-artifact@v7.0.1
        with:
          name: platform-jars
          path: |
            build/libs/dreamdisplayx-paper-*.jar
            build/libs/dreamdisplayx-velocity-*.jar
            build/libs/dreamdisplayx-bungeecord-*.jar
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: build-jars-${{ matrix.mc }}
          path: artifacts/*.jar
          if-no-files-found: error
          compression-level: 0
          retention-days: 7