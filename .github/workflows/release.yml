# Publishing pipeline. Runs only on a manual workflow_dispatch; the publish
# type (release / preview / dev) is chosen directly from the `build_type` input.

name: Release

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: >-
          Publish type. release = stable public release, preview = alpha
          pre-release, dev = build artifacts only (never published).
        required: true
        default: release
        type: choice
        options:
          - release
          - preview
          - dev

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/_build.yml
    with:
      pull_request: false
      build_type: ${{ inputs.build_type }}

  github-prerelease:
    name: Publish GitHub pre-release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
      - name: No GitHub pre-release needed
        if: needs.build.outputs.is_dev != 'true' && needs.build.outputs.is_preview != 'true'
        run: echo "Version ${{ needs.build.outputs.version }} is not a dev or preview pre-release."

      - name: Checkout repository
        if: needs.build.outputs.is_dev == 'true' || needs.build.outputs.is_preview == 'true'
        uses: actions/checkout@v6.0.3
        with:
          fetch-depth: 0

      - name: Download all build artifacts
        if: needs.build.outputs.is_dev == 'true' || needs.build.outputs.is_preview == 'true'
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: build-jars-*
          path: build/libs
          merge-multiple: true

      - name: Download cross-version platform jars
        if: needs.build.outputs.is_dev == 'true' || needs.build.outputs.is_preview == 'true'
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: platform-jars
          path: build/libs
          merge-multiple: true

      - name: Extract changelog for pre-release
        if: needs.build.outputs.is_dev == 'true' || needs.build.outputs.is_preview == 'true'
        run: |
          python - <<'EOF'
          import re
          import sys

          with open("CHANGELOG.md") as f:
              content = f.read()

          # Match by the version's numeric trunk (e.g. "1.9.3.1"), so the same CHANGELOG entry is
          # used whether this dispatch is a dev, preview, or release build of that version, and a
          # "-dev" / "-preview.N" suffix in gradle.properties still finds the matching heading.
          # The (?![\d.]) guard stops "1.9.3" from matching the "1.9.3.1" heading.
          version = "${{ needs.build.outputs.version }}".split("-")[0]
          pattern = rf"^# {re.escape(version)}(?![\d.])\s+(?:[^\n]*)\n(.*?)(?=\n# \S|\Z)"
          match = re.search(pattern, content, re.DOTALL | re.MULTILINE)

          if not match:
              with open("changelog.md", "w") as f:
                  f.write("")
              sys.exit(0)

          block = match.group(1)
          sections = re.split(r"^## ", block, flags=re.MULTILINE)
          lines = []

          for section in sections:
              if not section.strip():
                  continue

              header, _, body = section.partition("\n")
              lines.append(f"## {header.strip()}")

              for item in body.splitlines():
                  item = item.strip()
                  if item:
                      lines.append(item)

              lines.append("")

          with open("changelog.md", "w") as f:
              f.write("\n".join(lines).strip() + "\n")
          EOF

      - name: Generate incremental preview changelog
        if: needs.build.outputs.is_preview == 'true'
        env:
          CHANGELOG_VERSION: ${{ needs.build.outputs.version }}
          CHANGELOG_IS_PREVIEW: true
          CHANGELOG_TAG: v${{ needs.build.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python .github/scripts/generate_changelog.py

      - name: Publish dev pre-release
        if: needs.build.outputs.is_dev == 'true'
        run: |
          TAG="v${{ needs.build.outputs.version }}"
          gh release delete "$TAG" --repo "${{ github.repository }}" --yes 2>/dev/null || true
          gh release create "$TAG" --repo "${{ github.repository }}" --title "${{ needs.build.outputs.pretty_version }}" --prerelease --notes-file changelog.md build/libs/dreamdisplayx-*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish preview pre-release
        if: needs.build.outputs.is_preview == 'true'
        run: |
          TAG="v${{ needs.build.outputs.version }}"
          gh release create "$TAG" --repo "${{ github.repository }}" --title "${{ needs.build.outputs.pretty_version }}" --prerelease --notes-file changelog.md build/libs/dreamdisplayx-*.jar \
          || gh release upload "$TAG" build/libs/dreamdisplayx-*.jar --repo "${{ github.repository }}" --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-core-loaders:
    name: Publish BungeeCord / Velocity / Paper
    runs-on: ubuntu-latest
    needs: [ build ]
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        if: needs.build.outputs.is_marketplace_publishable == 'true'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download build artifacts
        if: needs.build.outputs.is_marketplace_publishable == 'true'
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: build-jars-*
          path: build/libs
          merge-multiple: true

      - name: Download cross-version platform jars
        if: needs.build.outputs.is_marketplace_publishable == 'true'
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: platform-jars
          path: build/libs
          merge-multiple: true

      - name: Extract Paper game versions
        if: needs.build.outputs.is_marketplace_publishable == 'true'
        id: versions
        run: |
          python - <<'EOF'
          import os

          paper_1_21 = ["1.21"] + [f"1.21.{p}" for p in range(1, 12)]
          paper_26 = ["26.1", "26.1.1", "26.1.2", "26.2"]
          paper_versions = paper_1_21 + paper_26

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("paper_versions<<VERSIONS_EOF\n")
              f.write("\n".join(paper_versions) + "\n")
              f.write("VERSIONS_EOF\n")
              f.write("paper_label=1.21+\n")
          EOF

      - name: Extract changelog
        if: needs.build.outputs.is_marketplace_publishable == 'true' && (needs.build.outputs.is_release == 'true' || needs.build.outputs.is_preview == 'true')
        run: |
          python - <<'EOF'
          import os
          import re
          import sys

          with open("CHANGELOG.md") as f:
              content = f.read()

          # Use the numeric trunk (strip any -dev / -preview.N suffix) so the CHANGELOG heading
          # for that version is found regardless of the chosen build type.
          version = "${{ needs.build.outputs.version }}".split("-")[0]
          is_preview = "${{ needs.build.outputs.is_preview }}" == "true"

          # Match by the version number alone (e.g. "1.9.3.1"), so the same CHANGELOG entry is used
          # regardless of whether this dispatch is a dev, preview, or release build. The (?![\d.])
          # guard stops "1.9.3" from matching the "1.9.3.1" heading.
          pattern = rf"^# {re.escape(version)}(?![\d.])\s+(?:[^\n]*)\n(.*?)(?=\n# \S|\Z)"
          match = re.search(pattern, content, re.DOTALL | re.MULTILINE)

          if not match:
              if is_preview:
                  with open("changelog.md", "w") as f:
                      f.write("")
                  sys.exit(0)

              sys.exit(f"Version {version} not found in CHANGELOG.md")

          block = match.group(1)
          sections = re.split(r"^## ", block, flags=re.MULTILINE)
          lines = []

          for section in sections:
              if not section.strip():
                  continue

              header, _, body = section.partition("\n")
              lines.append(f"## {header.strip()}")

              for item in body.splitlines():
                  item = item.strip()
                  if item:
                      lines.append(item)

              lines.append("")

          with open("changelog.md", "w") as f:
              f.write("\n".join(lines).strip() + "\n")
          EOF

      - name: Generate incremental preview changelog for platforms
        if: needs.build.outputs.is_marketplace_publishable == 'true' && needs.build.outputs.is_preview == 'true'
        env:
          CHANGELOG_VERSION: ${{ needs.build.outputs.version }}
          CHANGELOG_IS_PREVIEW: true
          CHANGELOG_TAG: v${{ needs.build.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python .github/scripts/generate_changelog.py

      - name: Publish BungeeCord to Modrinth
        if: needs.build.outputs.is_marketplace_publishable == 'true'
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          name: 'Dream DisplaysX ${{ needs.build.outputs.pretty_version }} — BungeeCord'
          version: ${{ needs.build.outputs.version }}
          version-type: ${{ needs.build.outputs.is_preview == 'true' && 'alpha' || 'release' }}
          files: build/libs/dreamdisplayx-bungeecord-${{ needs.build.outputs.version }}.jar
          changelog-file: changelog.md
          modrinth-id: O9VrWVkP
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          loaders: bungeecord
          game-versions: ${{ steps.versions.outputs.paper_versions }}
          game-version-filter: none

      - name: Publish Velocity to Modrinth
        if: needs.build.outputs.is_marketplace_publishable == 'true'
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          name: 'Dream DisplaysX ${{ needs.build.outputs.pretty_version }} — Velocity'
          version: ${{ needs.build.outputs.version }}
          version-type: ${{ needs.build.outputs.is_preview == 'true' && 'alpha' || 'release' }}
          files: build/libs/dreamdisplayx-velocity-${{ needs.build.outputs.version }}.jar
          changelog-file: changelog.md
          modrinth-id: O9VrWVkP
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          loaders: velocity
          game-versions: ${{ steps.versions.outputs.paper_versions }}
          game-version-filter: none

      - name: Publish Paper to Modrinth
        if: needs.build.outputs.is_marketplace_publishable == 'true'
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          name: 'Dream DisplaysX ${{ needs.build.outputs.pretty_version }} — Paper ${{ steps.versions.outputs.paper_label }}'
          version: ${{ needs.build.outputs.version }}
          version-type: ${{ needs.build.outputs.is_preview == 'true' && 'alpha' || 'release' }}
          files: build/libs/dreamdisplayx-paper-${{ needs.build.outputs.version }}.jar
          changelog-file: changelog.md
          modrinth-id: O9VrWVkP
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          loaders: |
            folia
            paper
            purpur
          game-versions: ${{ steps.versions.outputs.paper_versions }}
          game-version-filter: none
          dependencies: |
            luckperms(optional){modrinth:Vebnzrzj}

      - name: Download all build artifacts for GitHub Release
        if: needs.build.outputs.is_marketplace_publishable == 'true' && needs.build.outputs.is_release == 'true'
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: build-jars-*
          path: build/libs
          merge-multiple: true

      - name: Download cross-version platform jars
        if: needs.build.outputs.is_marketplace_publishable == 'true' && needs.build.outputs.is_release == 'true'
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: platform-jars
          path: build/libs
          merge-multiple: true

      - name: Create GitHub Release
        if: needs.build.outputs.is_marketplace_publishable == 'true' && needs.build.outputs.is_release == 'true'
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          name: ${{ needs.build.outputs.pretty_version }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-tag: v${{ needs.build.outputs.version }}
          github-generate-changelog: false
          github-draft: false
          files: build/libs/dreamdisplayx-*.jar
          changelog-file: changelog.md

  prepare-loader-matrix:
    name: Filter NeoForge / Fabric matrix
    runs-on: ubuntu-latest
    needs: build
    outputs:
      tasks: ${{ steps.filter.outputs.tasks }}

    steps:
      - name: Filter tasks to NeoForge / Fabric only
        id: filter
        run: |
          python - <<'EOF'
          import json
          import os

          tasks = json.loads(os.environ["TASKS_JSON"])
          filtered = [t for t in tasks if t["kind"] in ("neoforge", "fabric")]

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"tasks={json.dumps(filtered)}\n")
          EOF
        env:
          TASKS_JSON: ${{ needs.build.outputs.marketplace_publish_tasks }}

  publish:
    name: Publish ${{ matrix.task.kind }} ${{ matrix.task.mc }}
    runs-on: ubuntu-latest
    needs: [ build, prepare-loader-matrix ]
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        task: ${{ fromJSON(needs.prepare-loader-matrix.outputs.tasks) }}
    permissions:
      contents: write

    steps:
      - name: Marketplace publishing not needed
        if: needs.build.outputs.is_marketplace_publishable != 'true'
        run: echo "Version ${{ needs.build.outputs.version }} is not marketplace-publishable."

      - name: Checkout repository
        if: needs.build.outputs.is_marketplace_publishable == 'true'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download build artifacts
        if: needs.build.outputs.is_marketplace_publishable == 'true'
        uses: actions/download-artifact@v8.0.1
        with:
          name: build-jars-${{ matrix.task.mc }}
          path: build/libs

      - name: Extract versions
        if: needs.build.outputs.is_marketplace_publishable == 'true'
        id: versions
        run: |
          python - <<'EOF'
          import json
          import os

          mc = "${{ matrix.task.mc }}"

          # Version metadata moved from versions/<mc>/gradle.properties to versions.json
          # (upstream 3859aeba); the old per-version properties files no longer exist.
          with open("versions.json", encoding="utf-8") as f:
              versions_data = json.load(f)
          props = versions_data["versions"].get(mc, {})

          minecraft_version = props.get("minecraft.version", mc)

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"mc={mc}\n")
              f.write("mc_versions<<VERSIONS_EOF\n")
              f.write(minecraft_version + "\n")
              f.write("VERSIONS_EOF\n")
          EOF

      - name: Extract changelog
        if: needs.build.outputs.is_marketplace_publishable == 'true' && (needs.build.outputs.is_release == 'true' || needs.build.outputs.is_preview == 'true')
        run: |
          python - <<'EOF'
          import os
          import re
          import sys

          with open("CHANGELOG.md") as f:
              content = f.read()

          version = "${{ needs.build.outputs.version }}".split("-")[0]
          is_preview = "${{ needs.build.outputs.is_preview }}" == "true"

          pattern = rf"^# {re.escape(version)}(?![\d.])\s+(?:[^\n]*)\n(.*?)(?=\n# \S|\Z)"
          match = re.search(pattern, content, re.DOTALL | re.MULTILINE)

          if not match:
              if is_preview:
                  with open("changelog.md", "w") as f:
                      f.write("")
                  sys.exit(0)

              sys.exit(f"Version {version} not found in CHANGELOG.md")

          block = match.group(1)
          sections = re.split(r"^## ", block, flags=re.MULTILINE)
          lines = []

          for section in sections:
              if not section.strip():
                  continue

              header, _, body = section.partition("\n")
              lines.append(f"## {header.strip()}")

              for item in body.splitlines():
                  item = item.strip()
                  if item:
                      lines.append(item)

              lines.append("")

          with open("changelog.md", "w") as f:
              f.write("\n".join(lines).strip() + "\n")
          EOF

      - name: Publish Fabric to Modrinth
        if: needs.build.outputs.is_marketplace_publishable == 'true' && matrix.task.kind == 'fabric'
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          name: 'Dream DisplaysX ${{ needs.build.outputs.pretty_version }} — Fabric ${{ matrix.task.mc }}'
          version: ${{ needs.build.outputs.version }}
          version-type: ${{ needs.build.outputs.is_preview == 'true' && 'alpha' || 'release' }}
          files: build/libs/dreamdisplayx-fabric-${{ matrix.task.mc }}-${{ needs.build.outputs.version }}.jar
          changelog-file: changelog.md
          modrinth-id: O9VrWVkP
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          loaders: |
            fabric
            quilt
          game-versions: ${{ steps.versions.outputs.mc_versions }}
          game-version-filter: none
          dependencies: |
            fabric-api(required){modrinth:P7dR8mSH}
            luckperms(optional){modrinth:Vebnzrzj}

      - name: Publish NeoForge to Modrinth
        if: needs.build.outputs.is_marketplace_publishable == 'true' && matrix.task.kind == 'neoforge'
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          name: 'Dream DisplaysX ${{ needs.build.outputs.pretty_version }} — NeoForge ${{ matrix.task.mc }}'
          version: ${{ needs.build.outputs.version }}
          version-type: ${{ needs.build.outputs.is_preview == 'true' && 'alpha' || 'release' }}
          files: build/libs/dreamdisplayx-neoforge-${{ matrix.task.mc }}-${{ needs.build.outputs.version }}.jar
          changelog-file: changelog.md
          modrinth-id: O9VrWVkP
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          loaders: neoforge
          game-versions: ${{ steps.versions.outputs.mc_versions }}
          game-version-filter: none
          dependencies: |
            luckperms(optional){modrinth:Vebnzrzj}
