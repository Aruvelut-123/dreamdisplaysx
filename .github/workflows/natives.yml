# Build Natives — standalone workflow
#
# Builds native runtimes from source and publishes them as a GitHub Release:
#
#   libvlc — the official VideoLAN runtime (libvlc.dll / .so / .dylib + plugins).
#            Still required for audio output and the playback clock while the
#            FFmpeg video pipeline owns decoding.
#   ffmpeg — FFmpeg built from upstream source (libavcodec / libavformat /
#            libavutil / swscale / swresample / swresample + the JavaCPP JNI shims).
#            Uses FFmpeg 9.0.2 with all hardware acceleration backends enabled.
#
# Trigger: manual (workflow_dispatch). The release tag is auto-generated from
# the commit SHA and timestamp, and the tag marker file
# (.github/natives-tag.txt) is updated so the main build workflow always picks
# up the latest pre-built natives.

name: Build Natives

on:
  workflow_dispatch:

concurrency:
  group: natives
  cancel-in-progress: false

permissions:
  contents: write

env:
  # Single source of truth for the FFmpeg version. Update here when bumping.
  FFMPEG_VER: 9.0.2

jobs:
  libvlc:
    name: libvlc ${{ matrix.libvlc.platform }}
    runs-on: ${{ matrix.libvlc.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        libvlc:
          - { platform: linux-x64,      os: Linux,   arch: x86_64,  runner: ubuntu-latest,           msystem: '' }
          - { platform: linux-aarch64,  os: Linux,   arch: aarch64, runner: ubuntu-24.04-arm,        msystem: '' }
          - { platform: macos-x64,      os: Mac,     arch: x86_64,  runner: macos-15-intel,          msystem: '' }
          - { platform: macos-aarch64,  os: Mac,     arch: aarch64, runner: macos-14,                msystem: '' }
          - { platform: windows-x86,    os: Windows, arch: x86,     runner: windows-latest,          msystem: MINGW32 }
          - { platform: windows-x64,    os: Windows, arch: x86_64,  runner: windows-latest,          msystem: MINGW64 }
          - { platform: windows-aarch64,os: Windows, arch: aarch64, runner: windows-11-arm,          msystem: CLANGARM64 }
          # Android: pulls the official org.videolan.android:libvlc-all Maven
          # AAR (monolithic libvlc.so) and renames libc++ to a unique SONAME;
          # pure download+extract+patchelf, any runner works.
          - { platform: android-aarch64, os: Android, arch: aarch64, runner: ubuntu-latest,          msystem: '' }
          - { platform: android-x64,     os: Android, arch: x86_64,  runner: ubuntu-latest,          msystem: '' }

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.3
        with:
          fetch-depth: 1

      - name: Cache libvlc build
        uses: actions/cache@v4.2.3
        with:
          path: native/libvlc/.build-cache
          # Covers both version knobs: VLC_VER (desktop archives) and
          # LIBVLC_ALL_VER (the Android Maven AAR). Bumping either must
          # invalidate the entry. Note: build.sh currently writes nothing
          # into .build-cache, so this step is a no-op today.
          key: libvlc-${{ matrix.libvlc.platform }}-vlc3.0.22-android3.7.7
          restore-keys: |
            libvlc-${{ matrix.libvlc.platform }}-
            libvlc-

      - name: Setup MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.libvlc.msystem }}
          update: false

      - name: Build libvlc native runtime from source (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          export OUT_DIR="$PWD/native-artifact/libvlc/${{ matrix.libvlc.platform }}"
          bash native/libvlc/build.sh ${{ matrix.libvlc.os }} ${{ matrix.libvlc.arch }}

      - name: Build libvlc native runtime from source
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          export OUT_DIR="$PWD/native-artifact/libvlc/${{ matrix.libvlc.platform }}"
          bash native/libvlc/build.sh ${{ matrix.libvlc.os }} ${{ matrix.libvlc.arch }}

      - name: Package libvlc native runtime
        shell: bash
        run: |
          tar czf "libvlc-${{ matrix.libvlc.platform }}.tar.gz" \
            -C native-artifact/libvlc/${{ matrix.libvlc.platform }} .

      - name: Upload packaged libvlc native runtime
        uses: actions/upload-artifact@v7.0.1
        with:
          name: libvlc-${{ matrix.libvlc.platform }}
          path: libvlc-${{ matrix.libvlc.platform }}.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  ffmpeg:
    name: ffmpeg ${{ matrix.ffmpeg.platform }}
    # Each target runs on a runner appropriate for the platform (native or cross-compile).
    runs-on: ${{ matrix.ffmpeg.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        ffmpeg:
          # Linux x86_64 (native)
          - { platform: linux-x86_64,  key: linux-x64,      runner: ubuntu-latest }
          # Linux ARM64 (cross-compile on x86_64 runner)
          - { platform: linux-aarch64,  key: linux-aarch64,  runner: ubuntu-latest }
          # macOS x86_64 (native on Intel runner)
          - { platform: macos-x86_64,   key: macos-x64,      runner: macos-15-intel }
          # macOS ARM64 (native on Apple Silicon runner)
          - { platform: macos-aarch64,  key: macos-aarch64,  runner: macos-14 }
          # Windows x86_64 (native on Windows runner with MSYS2/mingw-w64)
          - { platform: windows-x86_64, key: windows-x64,    runner: windows-latest }
          # Windows ARM64 (native on Windows ARM runner with mingw-w64 aarch64)
          - { platform: windows-aarch64, key: windows-aarch64, runner: windows-11-arm }
          # Android ARM64 (cross-compile on Linux runner with NDK)
          - { platform: android-arm64,  key: android-aarch64, runner: ubuntu-latest }
          # Android x86_64 (cross-compile on Linux runner with NDK)
          - { platform: android-x86_64, key: android-x64,    runner: ubuntu-latest }

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.3
        with:
          fetch-depth: 1

      - name: Setup MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.ffmpeg.msystem || 'MINGW64' }}
          update: false
          install: >
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkg-config
            ${{ matrix.ffmpeg.platform == 'windows-aarch64' && 'mingw-w64-aarch64-gcc' || '' }}

      - name: Setup Android NDK (Android targets)
        if: matrix.ffmpeg.platform == 'android-arm64' || matrix.ffmpeg.platform == 'android-x86_64'
        uses: android-actions/setup-android@v3
        with:
          ndk-version: r27c
          api-level: 24

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux' && (matrix.ffmpeg.platform == 'linux-x86_64' || matrix.ffmpeg.platform == 'linux-aarch64')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config \
            libva-dev libvdpau-dev libdrm-dev \
            ${{ matrix.ffmpeg.platform == 'linux-aarch64' && 'gcc-aarch64-linux-gnu g++-aarch64-linux-gnu' || '' }}

      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install pkg-config
          # For cross-compiling to ARM64 on Intel runner
          if [[ "${{ matrix.ffmpeg.platform }}" == "macos-aarch64" && "$(uname -m)" != "arm64" ]]; then
            brew install llvm mingw-w64
          fi

      - name: Build FFmpeg native runtime from source
        shell: bash
        env:
          FFMPEG_VER: ${{ env.FFMPEG_VER }}
          ANDROID_NDK: ${{ env.ANDROID_NDK_HOME || '/opt/android/ndk' }}
        run: |
          set -euo pipefail
          export OUT_DIR="$PWD/native-artifact/ffmpeg/${{ matrix.ffmpeg.key }}"
          bash native/ffmpeg/build.sh ${{ matrix.ffmpeg.platform }}

      - name: Package FFmpeg runtime
        shell: bash
        run: |
          tar czf "ffmpeg-${{ matrix.ffmpeg.key }}.tar.gz" \
            -C native-artifact/ffmpeg/${{ matrix.ffmpeg.key }} .

      - name: Upload packaged FFmpeg runtime
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ffmpeg-${{ matrix.ffmpeg.key }}
          path: ffmpeg-${{ matrix.ffmpeg.key }}.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [ libvlc, ffmpeg ]
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.gen_tag.outputs.tag }}

    steps:
      - name: Checkout repository (for tag marker update)
        uses: actions/checkout@v6.0.3
        with:
          fetch-depth: 1

      - name: Generate release tag
        id: gen_tag
        run: |
          SHA_SHORT="${GITHUB_SHA:0:7}"
          TS="$(date +%s)"
          echo "tag=natives-${SHA_SHORT}-${TS}" >> "$GITHUB_OUTPUT"

      - name: Download all native archives
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: '{libvlc,ffmpeg}-*'
          path: native-archives
          merge-multiple: true

      - name: List archives
        run: ls -la native-archives/

      - name: Create Release
        uses: softprops/action-gh-release@v2.2.2
        with:
          tag_name: ${{ steps.gen_tag.outputs.tag }}
          name: Natives ${{ steps.gen_tag.outputs.tag }}
          body: >
            Pre-built native libraries: the official LibVLC runtime (9 target
            platforms: 7 desktop + Android arm64/x86_64) and FFmpeg 9.0.2 built
            from source (9 target platforms including Windows ARM64).
          files: native-archives/*.tar.gz
          fail_on_unmatched_files: true
          draft: false
          prerelease: true

      - name: Update tag marker file
        env:
          # A Personal Access Token (classic or fine-grained with repo: contents write)
          # is required because the default GITHUB_TOKEN cannot trigger downstream
          # workflows. Keeps the legacy SQLITE_NATIVES_TOKEN secret name.
          TOKEN: ${{ secrets.SQLITE_NATIVES_TOKEN }}
          NATIVES_TAG: ${{ steps.gen_tag.outputs.tag }}
        if: env.TOKEN != ''
        run: |
          git clone "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" repo
          cd repo
          # Checkout the branch that triggered this workflow_dispatch so that
          # the tag marker file is present on it.
          git checkout "${{ github.ref_name }}"
          # Update the tag marker file. The natives manifest release_base is
          # injected by _build.yml at build time (release_base is never
          # releases/latest, since mod releases would steal it).
          echo "$NATIVES_TAG" > .github/natives-tag.txt
          git add .github/natives-tag.txt
          git -c user.name="natives-bot" \
              -c user.email="actions@github.com" \
              commit -m "chore: update natives tag to $NATIVES_TAG"
          git push
