# Build Natives — standalone workflow
#
# Collects the official LibVLC runtime (libvlc.dll / .so / .dylib + plugins)
# and publishes the binaries as a GitHub Release. Only the main project build
# workflow downloads them from that release, so the MSYS2 toolchains on Windows
# are not needed on every CI run.
#
# sqlite-jdbc ships as a plain dependency now: on NeoForge it rides along as a
# jar-in-jar, on Fabric/Paper the stock native binaries inside the fat loader
# jar are used directly — no custom-built (relocated-JNI) sqlite natives needed.
#
# Trigger: manual (workflow_dispatch). The release tag is auto-generated from
# the commit SHA and timestamp, and the tag marker file
# (.github/natives-tag.txt) is updated so the main build workflow always picks
# up the latest pre-built natives.

name: Build Natives

on:
  workflow_dispatch:

concurrency:
  group: natives
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  libvlc:
    name: libvlc ${{ matrix.libvlc.platform }}
    runs-on: ${{ matrix.libvlc.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        libvlc:
          - { platform: linux-x64,      os: Linux,   arch: x86_64,  runner: ubuntu-latest,           msystem: '' }
          - { platform: linux-aarch64,  os: Linux,   arch: aarch64, runner: ubuntu-24.04-arm,        msystem: '' }
          - { platform: macos-x64,      os: Mac,     arch: x86_64,  runner: macos-15-intel,          msystem: '' }
          - { platform: macos-aarch64,  os: Mac,     arch: aarch64, runner: macos-14,                msystem: '' }
          - { platform: windows-x86,    os: Windows, arch: x86,     runner: windows-latest,          msystem: MINGW32 }
          - { platform: windows-x64,    os: Windows, arch: x86_64,  runner: windows-latest,          msystem: MINGW64 }
          - { platform: windows-aarch64,os: Windows, arch: aarch64, runner: windows-11-arm,          msystem: CLANGARM64 }
          # Android: pulls the official org.videolan.android:libvlc-all Maven
          # AAR (monolithic libvlc.so) and renames libc++ to a unique SONAME;
          # pure download+extract+patchelf, any runner works.
          - { platform: android-aarch64, os: Android, arch: aarch64, runner: ubuntu-latest,          msystem: '' }
          - { platform: android-x64,     os: Android, arch: x86_64,  runner: ubuntu-latest,          msystem: '' }

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.3
        with:
          fetch-depth: 1

      - name: Cache libvlc build
        uses: actions/cache@v4.2.3
        with:
          path: native/libvlc/.build-cache
          key: libvlc-${{ matrix.libvlc.platform }}-3.0.22
          restore-keys: |
            libvlc-${{ matrix.libvlc.platform }}-
            libvlc-

      - name: Setup MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.libvlc.msystem }}
          update: false

      - name: Build libvlc native runtime from source (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          export OUT_DIR="$PWD/native-artifact/libvlc/${{ matrix.libvlc.platform }}"
          bash native/libvlc/build.sh ${{ matrix.libvlc.os }} ${{ matrix.libvlc.arch }}

      - name: Build libvlc native runtime from source
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          export OUT_DIR="$PWD/native-artifact/libvlc/${{ matrix.libvlc.platform }}"
          bash native/libvlc/build.sh ${{ matrix.libvlc.os }} ${{ matrix.libvlc.arch }}

      - name: Package libvlc native runtime
        shell: bash
        run: |
          tar czf "libvlc-${{ matrix.libvlc.platform }}.tar.gz" \
            -C native-artifact/libvlc/${{ matrix.libvlc.platform }} .

      - name: Upload packaged libvlc native runtime
        uses: actions/upload-artifact@v7.0.1
        with:
          name: libvlc-${{ matrix.libvlc.platform }}
          path: libvlc-${{ matrix.libvlc.platform }}.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [ libvlc ]
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.gen_tag.outputs.tag }}

    steps:
      - name: Checkout repository (for tag marker update)
        uses: actions/checkout@v6.0.3
        with:
          fetch-depth: 1

      - name: Generate release tag
        id: gen_tag
        run: |
          SHA_SHORT="${GITHUB_SHA:0:7}"
          TS="$(date +%s)"
          echo "tag=natives-${SHA_SHORT}-${TS}" >> "$GITHUB_OUTPUT"

      - name: Download all native archives
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: 'libvlc-*'
          path: native-archives
          merge-multiple: true

      - name: List archives
        run: ls -la native-archives/

      - name: Create Release
        uses: softprops/action-gh-release@v2.2.2
        with:
          tag_name: ${{ steps.gen_tag.outputs.tag }}
          name: Natives ${{ steps.gen_tag.outputs.tag }}
          body: >
            Pre-built native libraries for all 9 target platforms (7 desktop +
            Android arm64/x86_64): the official LibVLC runtime.
          files: native-archives/*.tar.gz
          fail_on_unmatched_files: true
          draft: false
          prerelease: true

      - name: Update tag marker file
        env:
          # A Personal Access Token (classic or fine-grained with repo: contents write)
          # is required because the default GITHUB_TOKEN cannot trigger downstream
          # workflows. Keeps the legacy SQLITE_NATIVES_TOKEN secret name.
          TOKEN: ${{ secrets.SQLITE_NATIVES_TOKEN }}
          NATIVES_TAG: ${{ steps.gen_tag.outputs.tag }}
        if: env.TOKEN != ''
        run: |
          git clone "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" repo
          cd repo
          # Checkout the branch that triggered this workflow_dispatch so that
          # the tag marker file is present on it.
          git checkout "${{ github.ref_name }}"
          # Update the tag marker file. The natives manifest release_base is
          # injected by _build.yml at build time (release_base is never
          # releases/latest, since mod releases would steal it).
          echo "$NATIVES_TAG" > .github/natives-tag.txt
          git add .github/natives-tag.txt
          git -c user.name="natives-bot" \
              -c user.email="actions@github.com" \
              commit -m "chore: update natives tag to $NATIVES_TAG"
          git push
