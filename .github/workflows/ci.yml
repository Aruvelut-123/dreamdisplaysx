name: CI

# Runs on every push to main and every PR. Always builds and uploads artifacts,
# with no conditional/skipped jobs, so the check set is complete and consistent.
on:
  push:
    branches: [ main ]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'SESSION_TASKS.md'
      - '.gitignore'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'SESSION_TASKS.md'
      - '.gitignore'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/_build.yml
    with:
      pull_request: ${{ github.event_name == 'pull_request' }}
