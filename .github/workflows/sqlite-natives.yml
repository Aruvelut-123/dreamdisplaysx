# Build SQLite Natives — standalone workflow
#
# Compiles the relocated sqlite-jdbc native library for all 6 platforms and
# publishes the binaries as a GitHub Release. Only the main project build
# workflow downloads them from that release, so the sqlite C compiler toolchain
# (MinGW on Windows) is not needed on every CI run.
#
# Trigger: manual (workflow_dispatch) with a release tag.
# Run this once when the sqlite-jdbc version or compiler flags change.
# After that, every CI build uses the pre-built libraries from the release.

name: Build SQLite Natives

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: >
        Release tag. Increment when the sqlite amalgamation version or
        compiler flags change (e.g., sqlite-natives-v1, sqlite-natives-v2).
      required: true
      default: 'sqlite-natives-v1'

concurrency:
  group: sqlite-natives
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: sqlite ${{ matrix.sqlite.platform }}
    runs-on: ${{ matrix.sqlite.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        sqlite:
          - { platform: linux-x64,      os: Linux,   arch: x86_64,  runner: ubuntu-latest }
          - { platform: linux-aarch64,  os: Linux,   arch: aarch64, runner: ubuntu-24.04-arm }
          - { platform: macos-x64,      os: Mac,     arch: x86_64,  runner: macos-15-intel }
          - { platform: macos-aarch64,  os: Mac,     arch: aarch64, runner: macos-14 }
          - { platform: windows-x64,    os: Windows, arch: x86_64,  runner: windows-latest }
          - { platform: windows-aarch64,os: Windows, arch: aarch64, runner: windows-11-arm }

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.3
        with:
          fetch-depth: 1

      - name: Setup JDK 25
        uses: actions/setup-java@v5.2.0
        with:
          java-version: 25
          distribution: zulu

      - name: Cache sqlite native build
        uses: actions/cache@v4.2.3
        with:
          path: |
            native/sqlite/amalgamation
            native/sqlite/sqlite-jdbc-src
          key: sqlite-${{ matrix.sqlite.platform }}
          restore-keys: |
            sqlite-${{ matrix.sqlite.platform }}-
            sqlite-

      - name: Install MinGW gcc on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          choco install mingw --no-progress -y
          echo "$PATH" >> /dev/null
          gcc --version

      - name: Build sqlite native library
        shell: bash
        run: |
          set -euo pipefail
          export OUT_DIR="$PWD/native-artifact/dreamdisplayx-natives/${{ matrix.sqlite.platform }}"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            export CC="gcc"
          elif [[ "${{ runner.os }}" == "macOS" ]]; then
            export CC="clang"
          else
            export CC="gcc"
          fi
          bash native/sqlite/compile.sh ${{ matrix.sqlite.os }} ${{ matrix.sqlite.arch }}

      - name: Package native library
        shell: bash
        run: |
          cd native-artifact
          tar czf "${{ runner.temp }}/native-${{ matrix.sqlite.platform }}.tar.gz" \
            dreamdisplayx-natives/${{ matrix.sqlite.platform }}

      - name: Upload packaged native library
        uses: actions/upload-artifact@v7.0.1
        with:
          name: native-${{ matrix.sqlite.platform }}
          path: ${{ runner.temp }}/native-${{ matrix.sqlite.platform }}.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [ build ]
    timeout-minutes: 5

    steps:
      - name: Download all native archives
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: native-*
          path: native-archives
          merge-multiple: true

      - name: List archives
        run: ls -la native-archives/

      - name: Create Release
        uses: softprops/action-gh-release@v2.2.2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: SQLite Natives ${{ inputs.release_tag }}
          body: >
            Pre-built sqlite-jdbc native libraries with relocated JNI symbols
            (com.dreamdisplayx.libs.org.sqlite) for all 6 target platforms.
          files: native-archives/native-*.tar.gz
          fail_on_unmatched_files: true
          draft: false
          prerelease: false

      - name: Update tag marker file
        env:
          # A Personal Access Token (classic or fine-grained with repo: contents write)
          # is required because the default GITHUB_TOKEN cannot trigger downstream
          # workflows. Create a secret named SQLITE_NATIVES_TOKEN in the repo settings.
          TOKEN: ${{ secrets.SQLITE_NATIVES_TOKEN }}
        if: env.TOKEN != ''
        run: |
          git clone "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" repo
          cd repo
          echo "${{ inputs.release_tag }}" > .github/sqlite-natives-tag.txt
          git add .github/sqlite-natives-tag.txt
          git -c user.name="sqlite-natives-bot" \
              -c user.email="actions@github.com" \
              commit -m "chore: update sqlite natives tag to ${{ inputs.release_tag }}"
          git push